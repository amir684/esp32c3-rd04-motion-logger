; ESP32-C3 SuperMini + Ai-Thinker RD-04 — battery motion logger
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3_supermini]
platform = espressif32
; The SuperMini is electrically the same as the XIAO C3 (4MB flash, native USB)
board = seeed_xiao_esp32c3
framework = arduino

board_build.partitions = partitions.csv
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; uncomment for Serial logs (they slow down every wake-up, so keep it off in the field)
    ; -DRD_DEBUG=1
